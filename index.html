<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>8-Ball Pool: Foul Rules Added</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>

<div class="status-panel">
    <div><div id="turn-badge" class="turn-indicator player-turn">PLAYER TURN</div></div>
    <div id="msg">Your Turn</div>
    <button onclick="resetGame()">Reset</button>
</div>

<canvas id="poolCanvas" width="800" height="400"></canvas>
<div id="ball-stand" class="ball-stand"></div>
<p style="text-align:center;color:white;font-size:12px;">Copyright © 2026 CheeseHackerXYZ. All rights reserved.</p>
<script>
    const canvas = document.getElementById('poolCanvas');
    const ctx = canvas.getContext('2d');
    const msgEl = document.getElementById('msg');
    const badgeEl = document.getElementById('turn-badge');
    const standEl = document.getElementById('ball-stand');

    const ball_r = 10;
    const pocket_r = 20;
    const MAX_SPEED = 14; const MAX_PULL = 150; const FRICTION = 0.985; 

    const pocket_pos = [[15,15],[400,10],[785,15],[15,385],[400,390],[785,385]];
    const board = [
        [0,0,800,0],[800,0,800,400],[800,400,0,400],[0,400,0,0],
        [25,0,390,0],[390,0,370,20],[370,20,45,20],[45,20,25,0],
        [410,0,775,0],[775,0,755,20],[755,20,430,20],[430,20,410,0],
        [25,400,390,400],[390,400,370,380],[370,380,45,380],[45,380,25,400],
        [410,400,775,400],[775,400,755,380],[755,380,430,380],[430,380,410,400],
        [0,25,0,375],[0,375,20,355],[20,355,20,45],[20,45,0,25],
        [800,25,800,375],[800,375,780,355],[780,355,780,45],[780,45,800,25]
    ];

    const ballColors = ["#FFD700", "#0000CD", "#ED2939", "#800080", "#FF8C00", "#32CD32", "#A52A2A", "#000000", "#FFD700", "#0000CD", "#ED2939", "#800080", "#FF8C00", "#32CD32", "#A52A2A"];

    let balls = [];
    let cueBall;
    let isDragging = false;
    let dragStart = { x: 0, y: 0 };
    let mousePos = { x: 0, y: 0 };
    
    let state = { 
        currentPlayer: "PLAYER", 
        playerGroup: null, 
        isMoving: false, 
        aiThinking: false, 
        pottedThisTurn: false, 
        cueBallPotted: false, 
        eightBallPotted: false,
        isBallInHand: false,
        firstBallHit: null // ショット時に最初に当たった球を記録
    };

    class Ball {
        constructor(x, y, radius, color, num, isCue = false) {
            this.x = x; this.y = y; this.vx = 0; this.vy = 0;
            this.radius = radius; this.color = color; this.num = num; this.isCue = isCue;
        }
        draw() {
            ctx.fillStyle = this.color;
            ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2); ctx.fill();
            if(this.isCue) { 
                ctx.strokeStyle = state.isBallInHand ? "#00ff00" : "#aaa"; 
                ctx.lineWidth = 2; ctx.stroke(); 
                return; 
            }
            ctx.fillStyle = (this.num === 8 || this.color === "#0000CD" || this.color === "#800080") ? "white" : "black";
            ctx.font = "bold 10px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
            ctx.fillText(this.num, this.x, this.y);
        }
        update() {
            let speed = Math.sqrt(this.vx**2 + this.vy**2);
    // 【重要】速度制限（壁を突き抜けない最大速度に固定）
    const SPEED_LIMIT = 15; 
    if (speed > SPEED_LIMIT) {
        this.vx = (this.vx / speed) * SPEED_LIMIT;
        this.vy = (this.vy / speed) * SPEED_LIMIT;
        speed = SPEED_LIMIT;
    }
            if (speed > 0) {
                this.x += this.vx; this.y += this.vy;
                this.vx *= FRICTION; this.vy *= FRICTION;
                if (speed < 0.15) { this.vx = 0; this.vy = 0; }
            }
        }
    }

    function isSafePosition(x, y) {
        if (x < 35 || x > 765 || y < 35 || y > 365) return false;
        for (let b of balls) {
            if (b.isCue) continue;
            const dist = Math.sqrt((x - b.x)**2 + (y - b.y)**2);
            if (dist < ball_r * 2.5) return false;
        }
        return true;
    }

    function createStandUI() {
        standEl.innerHTML = "";
        for (let i = 1; i <= 15; i++) {
            const d = document.createElement("div");
            d.id = `stand-ball-${i}`; d.className = "stand-ball";
            d.textContent = i; d.style.backgroundColor = ballColors[i-1];
            if (i === 8 || ballColors[i-1] === "#0000CD" || ballColors[i-1] === "#800080") d.style.color = "white";
            standEl.appendChild(d);
        }
    }

    function updateStandUI() {
        for (let i = 1; i <= 15; i++) {
            const el = document.getElementById(`stand-ball-${i}`);
            if (!el) continue;
            const isOnTable = balls.some(b => !b.isCue && b.num === i);
            if (!isOnTable) { el.classList.add("ball-potted"); el.classList.remove("my-group-target"); continue; }
            if (state.playerGroup) {
                const bGrp = (i <= 7) ? "LOW" : (i >= 9 ? "HIGH" : "EIGHT");
                const humanBallsRemain = balls.filter(b => !b.isCue && (state.playerGroup === "LOW" ? b.num <= 7 : b.num >= 9)).length;
                if (bGrp === state.playerGroup || (i === 8 && humanBallsRemain === 0)) el.classList.add("my-group-target");
                else el.classList.remove("my-group-target");
            }
        }
    }

    function resetGame() {
        balls = [];
        state = { currentPlayer: "PLAYER", playerGroup: null, isMoving: false, aiThinking: false, pottedThisTurn: false, cueBallPotted: false, eightBallPotted: false, isBallInHand: false, firstBallHit: null };
        createStandUI();
        cueBall = new Ball(200, 200, ball_r, "white", 0, true);
        balls.push(cueBall);
        const layout = [1, 9, 2, 10, 8, 3, 11, 4, 12, 5, 13, 6, 14, 7, 15];
        const rackStartX = 550, rackStartY = 200, dy = ball_r * 2 + 1, dx = Math.sqrt(3) * ball_r + 1;
        let idx = 0;
        for (let r = 0; r < 5; r++) {
            for (let c = 0; c <= r; c++) {
                balls.push(new Ball(rackStartX + r * dx, rackStartY + (c - r / 2) * dy, ball_r, ballColors[layout[idx]-1], layout[idx++]));
            }
        }
        updateTextUI(); updateStandUI();
    }

    function handlePotting(ball, index) {
        if (ball.isCue) { 
            state.cueBallPotted = true; 
            ball.vx = 0; ball.vy = 0; 
            ball.x = -100; ball.y = -100; 
            return; 
        }
        if (ball.num === 8) { state.eightBallPotted = true; balls.splice(index, 1); return; }

        const bGrp = ball.num <= 7 ? "LOW" : "HIGH";
        if (!state.playerGroup) {
            if (state.currentPlayer === "PLAYER") state.playerGroup = bGrp;
            else state.playerGroup = (bGrp === "LOW" ? "HIGH" : "LOW");
            msgEl.textContent = `Group: PLAYER is ${state.playerGroup}`;
        }

        const currentTurnGrp = (state.currentPlayer === "PLAYER") ? state.playerGroup : (state.playerGroup === "LOW" ? "HIGH" : "LOW");
        if (bGrp === currentTurnGrp) state.pottedThisTurn = true;
        balls.splice(index, 1);
        updateStandUI();
    }

    function checkPockets() {
        for (let i = balls.length - 1; i >= 0; i--) {
            const b = balls[i];
            for (const p of pocket_pos) {
                if (Math.sqrt((b.x - p[0])**2 + (b.y - p[1])**2) < pocket_r) { handlePotting(b, i); break; }
            }
        }
    }

function resolveWallCollision(ball) {
    board.forEach(line => {
        const x1 = line[0], y1 = line[1], x2 = line[2], y2 = line[3];
        const dx = x2 - x1, dy = y2 - y1;
        const l2 = dx * dx + dy * dy;
        if (l2 === 0) return;

        let t = Math.max(0, Math.min(1, ((ball.x - x1) * dx + (ball.y - y1) * dy) / l2));
        const closestX = x1 + t * dx, closestY = y1 + t * dy;
        const dist = Math.sqrt((ball.x - closestX) ** 2 + (ball.y - closestY) ** 2);

        if (dist < ball.radius) {
            if (dist > 0) {
                const nx = (ball.x - closestX) / dist;
                const ny = (ball.y - closestY) / dist;

                // 1. 位置の補正（めり込み解消）
                ball.x += nx * (ball.radius - dist);
                ball.y += ny * (ball.radius - dist);

                // 2. 速度の反射
                const dot = ball.vx * nx + ball.vy * ny;
                if (dot < 0) {
                    ball.vx -= 2 * dot * nx;
                    ball.vy -= 2 * dot * ny;
                    ball.vx *= 0.7; // 壁との摩擦/反発係数
                    ball.vy *= 0.7;
                }
            } else {
                // dist === 0 の場合：真上に重なっているので法線が定義できない
                // 強制的に外側（例えばテーブル中央方向など）へ押し出し、速度を殺す
                ball.x += (ball.x < 400 ? 1 : -1); 
                ball.vx *= -0.5;
            }
        }
    });
}

function resolveBallCollision(b1, b2) {
    const dx = b2.x - b1.x, dy = b2.y - b1.y;
    const distSq = dx*dx + dy*dy;
    const minDist = b1.radius + b2.radius;

    if (distSq < minDist * minDist) {
        // 1. 最初に当たった球の記録（既存ルール用）
        if ((b1.isCue || b2.isCue) && !state.firstBallHit) {
            state.firstBallHit = b1.isCue ? b2 : b1;
        }

        const dist = Math.sqrt(distSq);
        const nx = dx / dist, ny = dy / dist;

        // 2. めり込みの解消（位置のみ補正、速度は変えない）
        const overlap = minDist - dist;
        const percent = 0.5; // 押し出しの強さ
        b1.x -= nx * overlap * percent;
        b1.y -= ny * overlap * percent;
        b2.x += nx * overlap * percent;
        b2.y += ny * overlap * percent;

        // 3. 衝突応答（相対速度に基づいた計算）
        // これにより、エネルギーが勝手に増えるのを防ぐ
        const relativeVx = b1.vx - b2.vx;
        const relativeVy = b1.vy - b2.vy;
        const velocityAlongNormal = relativeVx * nx + relativeVy * ny;

        // 既に離れようとしている場合は処理しない
        if (velocityAlongNormal < 0) return;

        // 反発係数（1.0で完全弾性衝突。少し下げるとリアル）
        const restitution = 0.9;
        let j = -(1 + restitution) * velocityAlongNormal;
        j /= 1/1 + 1/1; // 質量が同じなので単純化可能

        const impulseX = j * nx, impulseY = j * ny;
        b1.vx += impulseX; b1.vy += impulseY;
        b2.vx -= impulseX; b2.vy -= impulseY;
    }
}
    function executeAIShot() {
        if (balls.length <= 1 || state.eightBallPotted) return;
        state.wasGroupDecidedAtStart = !!state.playerGroup;
        const aiGrp = (state.playerGroup === "LOW") ? "HIGH" : "LOW";
        let targets = balls.filter(b => !b.isCue && b.num !== 8);
        if (state.playerGroup) {
            const aiTargets = targets.filter(b => (aiGrp === "LOW" ? b.num <= 7 : b.num >= 9));
            targets = (aiTargets.length > 0) ? aiTargets : balls.filter(b => b.num === 8);
        }
        let closest = targets[0], minDist = Infinity;
        targets.forEach(b => {
            const d = Math.sqrt((b.x - cueBall.x)**2 + (b.y - cueBall.y)**2);
            if (d < minDist) { minDist = d; closest = b; }
        });
        if (closest) {
            const angle = Math.atan2(closest.y - cueBall.y, closest.x - cueBall.x);
            cueBall.vx = Math.cos(angle) * 10; cueBall.vy = Math.sin(angle) * 10;
        }
        state.firstBallHit = null; // ショット開始時に初期化
        state.aiThinking = false;
        state.isMoving = true;
    }

    function updateTextUI() {
        badgeEl.textContent = state.currentPlayer + (state.isBallInHand ? " (HAND)" : " TURN");
        badgeEl.className = "turn-indicator " + (state.currentPlayer === "PLAYER" ? "player-turn" : "ai-turn");
        msgEl.textContent = state.isBallInHand ? "Place the cue ball" : (state.currentPlayer === "PLAYER" ? "Your Turn" : "AI Thinking...");
    }

    function update() {
        if (state.isBallInHand) {
            cueBall.x = mousePos.x; cueBall.y = mousePos.y;
            return;
        }

        balls.forEach(b => b.update());
        checkPockets();
        for (let i = 0; i < balls.length; i++) {
            for (let j = i + 1; j < balls.length; j++) resolveBallCollision(balls[i], balls[j]);
        }
        balls.forEach(b => resolveWallCollision(b));
        
// --- 場外（突き抜け）対策ロジック ---
    // 白球が画面の外（上下左右）に完全に出てしまった場合
    if (cueBall.x < -10 || cueBall.x > canvas.width + 10 || 
        cueBall.y < -10 || cueBall.y > canvas.height + 10) {
        
        // すでにポット（ポケット入り）扱いになっていない場合のみ実行
        if (!state.cueBallPotted) {
            state.cueBallPotted = true; // スクラッチ扱いにする
            cueBall.vx = 0; cueBall.vy = 0;
            cueBall.x = -100; cueBall.y = -100;
            console.log("Boundary escape detected: Cue ball returned.");
        }
    }

// --- update関数内の判定部分 ---
const stopped = balls.every(b => b.vx === 0 && b.vy === 0);
if (stopped && state.isMoving) {
    state.isMoving = false;
    
    // 現在のプレイヤーのグループと残り球数を確認
    const currentTurnGrp = (state.currentPlayer === "PLAYER") ? state.playerGroup : (state.playerGroup === "LOW" ? "HIGH" : "LOW");
    const myBallsRemain = balls.filter(b => !b.isCue && (currentTurnGrp === "LOW" ? b.num <= 7 : b.num >= 9)).length;
    
    // --- ファウル判定（再利用） ---
    let isFoul = false;
    if (state.cueBallPotted || !state.firstBallHit) {
        isFoul = true;
    } else if (state.wasGroupDecidedAtStart && state.playerGroup) {
        const hitGrp = state.firstBallHit.num <= 7 ? "LOW" : (state.firstBallHit.num >= 9 ? "HIGH" : "EIGHT");
        if (hitGrp === "EIGHT") {
            if (myBallsRemain > 0) isFoul = true;
        } else if (hitGrp !== currentTurnGrp) {
            isFoul = true;
        }
    }

    // --- 8番ボールがポケットされた時の最終判定 ---
    if (state.eightBallPotted) {
        let win = false;
        // 勝利条件: 自分の球が0個 かつ ファウルしていない
        if (myBallsRemain === 0 && !isFoul) {
            win = true;
        } else {
            win = false; // 8番を入れたが、自分の球が残っているか、ファウル（スクラッチ等）した
        }

        alert(win ? state.currentPlayer + " WIN!" : state.currentPlayer + " LOSE (8-Ball Foul)!");
        resetGame();
        return;
    }

    // --- 通常のターン終了処理 ---
    if (isFoul) {
        alert("FOUL!");
        state.currentPlayer = (state.currentPlayer === "PLAYER" ? "AI" : "PLAYER");
        if (state.currentPlayer === "PLAYER") state.isBallInHand = true;
        else if (state.cueBallPotted) { cueBall.x = 200; cueBall.y = 200; }
    } else {
        if (!state.pottedThisTurn) {
            state.currentPlayer = (state.currentPlayer === "PLAYER" ? "AI" : "PLAYER");
        }
    }

    state.pottedThisTurn = false; state.cueBallPotted = false; state.firstBallHit = null;
    updateTextUI(); updateStandUI();
}

        if (stopped && state.currentPlayer === "AI" && !state.aiThinking && !state.isMoving && !state.isBallInHand) {
            state.aiThinking = true;
            setTimeout(executeAIShot, 1200);
        }
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#111"; pocket_pos.forEach(p => { ctx.beginPath(); ctx.arc(p[0], p[1], pocket_r, 0, Math.PI*2); ctx.fill(); });
        ctx.fillStyle = "#1b4d22";
        for (let i = 4; i < board.length; i += 4) {
            ctx.beginPath(); ctx.moveTo(board[i][0], board[i][1]); ctx.lineTo(board[i][2], board[i][3]);
            ctx.lineTo(board[i+1][2], board[i+1][3]); ctx.lineTo(board[i+2][2], board[i+2][3]); ctx.fill();
        }

        if (state.isBallInHand) {
            const canPlace = isSafePosition(mousePos.x, mousePos.y);
            ctx.save(); ctx.globalAlpha = 0.5;
            ctx.strokeStyle = canPlace ? "#00ff00" : "#ff0000"; ctx.lineWidth = 3;
            ctx.beginPath(); ctx.arc(mousePos.x, mousePos.y, ball_r + 2, 0, Math.PI*2); ctx.stroke();
            ctx.restore();
        }

        if (isDragging && state.currentPlayer === "PLAYER" && !state.isBallInHand) {
            const angle = Math.atan2(dragStart.y - mousePos.y, dragStart.x - mousePos.x);
            const dx = Math.cos(angle), dy = Math.sin(angle);
            let hitT = null, minDist = 1000;
            balls.forEach(b => {
                if (b.isCue) return;
                const vx = b.x - cueBall.x, vy = b.y - cueBall.y;
                const proj = vx * dx + vy * dy;
                if (proj > 0) {
                    const perpSq = (vx * vx + vy * vy) - (proj * proj);
                    if (perpSq < (ball_r * 2)**2) {
                        const d = proj - Math.sqrt((ball_r * 2)**2 - perpSq);
                        if (d < minDist) { minDist = d; hitT = b; }
                    }
                }
            });
            const hX = cueBall.x + dx * minDist, hY = cueBall.y + dy * minDist;
            ctx.setLineDash([5, 5]); ctx.strokeStyle = "rgba(255,255,255,0.4)";
            ctx.beginPath(); ctx.moveTo(cueBall.x, cueBall.y); ctx.lineTo(hX, hY); ctx.stroke();
            ctx.setLineDash([]);
            if (hitT) {
                ctx.strokeStyle = "rgba(255,255,255,0.3)"; ctx.beginPath(); ctx.arc(hX, hY, ball_r, 0, Math.PI*2); ctx.stroke();
                const tAng = Math.atan2(hitT.y - hY, hitT.x - hX);
                ctx.strokeStyle = "#ffeb3b"; ctx.beginPath(); ctx.moveTo(hitT.x, hitT.y);
                ctx.lineTo(hitT.x + Math.cos(tAng)*60, hitT.y + Math.sin(tAng)*60); ctx.stroke();
            }
        }
        balls.forEach(b => b.draw());
    }

    canvas.addEventListener('pointerdown', e => {
        const r = canvas.getBoundingClientRect();
        const px = e.clientX - r.left, py = e.clientY - r.top;
        if (state.isBallInHand && state.currentPlayer === "PLAYER") {
            if (isSafePosition(px, py)) {
                cueBall.x = px; cueBall.y = py; state.isBallInHand = false;
                updateTextUI();
            }
            return;
        }
        if (!balls.every(b => b.vx === 0 && b.vy === 0) || state.currentPlayer !== "PLAYER") return;
        if (Math.sqrt((px - cueBall.x)**2 + (py - cueBall.y)**2) < ball_r * 5) { 
            dragStart.x = px; dragStart.y = py; isDragging = true; 
            state.firstBallHit = null; // ショット前にリセット
            canvas.setPointerCapture(e.pointerId); 
        }
    });

    window.addEventListener('pointermove', e => { 
        const r = canvas.getBoundingClientRect(); 
        mousePos.x = e.clientX - r.left; mousePos.y = e.clientY - r.top; 
    });

    window.addEventListener('pointerup', e => {
        if (!isDragging) return;
        state.wasGroupDecidedAtStart = !!state.playerGroup;
        const r = canvas.getBoundingClientRect();
        const dx = dragStart.x - (e.clientX - r.left), dy = dragStart.y - (e.clientY - r.top);
        const dist = Math.min(Math.sqrt(dx*dx + dy*dy), MAX_PULL);
        const angle = Math.atan2(dy, dx);
        cueBall.vx = Math.cos(angle) * dist * 0.15; cueBall.vy = Math.sin(angle) * dist * 0.15;
        isDragging = false; state.isMoving = true;
    });

    function loop() { update(); draw(); requestAnimationFrame(loop); }
    resetGame(); loop();
</script>
</body>
</html>
